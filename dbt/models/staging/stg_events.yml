version: 2

models:
  - name: stg_events
    description: One row per real click (duplicates removed). Grain = event_id.
    columns:
      - name: event_id
        description: Unique id generated on the device for each click.
        data_tests:
          - unique
          - not_null
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [page_view, search, product_view, add_to_cart,
                         remove_from_cart, checkout_start, purchase]
      - name: event_ts
        data_tests: [not_null]
      - name: anonymous_id
        description: Device / cookie id. Null is allowed only when user_id is set.
      - name: revenue
        description: price x quantity for purchase events, else 0.